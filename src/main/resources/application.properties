spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/tacocloud
spring.datasource.username=tacouser
spring.datasource.password=tacopassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.schema=order-schema.sql,ingredient-schema.sql,taco-schema.sql,user-schema.sql
spring.datasource.data=ingredients.sql

spring.datasource.generate-unique-name=false
spring.datasource.name=tacocloud

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

spring.security.oauth2.client.registration.google.client-name=taco_cloud

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.port=9090